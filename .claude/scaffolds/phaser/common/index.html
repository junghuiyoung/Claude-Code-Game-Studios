<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Phaser Starter</title>
  </head>
  <body>
    <main id="demo">
      <div id="game" aria-label="Phaser input demo"></div>
      <div class="hud">
        <header>
          <h1>Phaser Starter</h1>

        </footer>
      </div>
    </main>
    <script type="module" src="./src/phaser/main.ts"></script>
