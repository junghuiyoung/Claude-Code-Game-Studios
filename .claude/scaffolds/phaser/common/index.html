<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Phaser Starter</title>
  </head>
  <body>
    <main id="demo">
      <div id="game" aria-label="Phaser input demo"></div>
      <div class="hud">
        <header>
          <h1>Phaser Starter</h1>
          <div class="input-hints" role="group" aria-label="Movement controls">
            <div id="movement-key-hint" class="input-hint" role="img" aria-label="Move: W up, A left, S down, D right">
              <div class="key-cluster" aria-hidden="true">
                <kbd id="movement-up" class="key-up">W</kbd>
                <kbd id="movement-left" class="key-left">A</kbd>
                <kbd id="movement-down" class="key-down">S</kbd>
                <kbd id="movement-right" class="key-right">D</kbd>
              </div>
              <span aria-hidden="true">Move</span>
            </div>
            <div class="input-hint" role="img" aria-label="Move with the up, left, down, and right arrow keys">
              <div class="key-cluster" aria-hidden="true">
                <kbd class="key-up">↑</kbd>
                <kbd class="key-left">←</kbd>
                <kbd class="key-down">↓</kbd>
                <kbd class="key-right">→</kbd>
              </div>
              <span aria-hidden="true">Move</span>
            </div>
            <div class="input-hint" role="img" aria-label="Tap or click the grid to move">
              <svg class="pointer-hint" viewBox="0 0 56 56" aria-hidden="true" focusable="false">
                <circle cx="20" cy="19" r="12" />
                <circle cx="20" cy="19" r="4" />
                <path d="M20 19 25 45 31 37 39 48 44 44 36 34 46 31Z" />
              </svg>
              <span aria-hidden="true">Tap/click</span>
            </div>
          </div>
        </header>
        <footer>
          <p id="status" role="status">Loading</p>
          <div class="controls">
            <button id="play-toggle" type="button" disabled>Start</button>
            <button id="reset-demo" type="button" disabled>Reset</button>
          </div>
        </footer>
      </div>
    </main>
    <script type="module" src="./src/phaser/main.ts"></script>
  </body>
</html>
